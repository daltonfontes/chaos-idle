name: Server deploy

# Builds the server's Docker image, starts the whole production stack from deploy/ (Caddy with
# HTTPS, the server, PostgreSQL, backups) with DOMAIN=localhost, and checks it end to end with
# deploy/smoke-test.sh. On main, the image is published to GitHub Container Registry.

on:
  push:
  pull_request:

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the server image
        run: docker build -f deploy/Dockerfile -t chaos-idle-server:ci .

      - name: Start the stack (HTTPS with Caddy's local certificate)
        working-directory: deploy
        run: |
          printf '%s\n' DOMAIN=localhost ACME_EMAIL=ci@example.com POSTGRES_PASSWORD=ci-password \
            SERVER_IMAGE=chaos-idle-server:ci RATE_LIMIT_ANONYMOUS_PER_MINUTE=5 > .env
          docker compose up -d --no-build
          docker compose ps

      - name: Smoke test (HTTPS, redirect, health, accounts, rate limit, backup and restore)
        working-directory: deploy
        run: ./smoke-test.sh

      - name: Stack logs
        if: always()
        working-directory: deploy
        run: docker compose logs --no-color --tail 200

      - name: Publish the image to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chaos-idle-server"
          docker tag chaos-idle-server:ci "$image:latest"
          docker tag chaos-idle-server:ci "$image:${GITHUB_SHA::7}"
          docker push --all-tags "$image"
          echo "Published $image:latest and $image:${GITHUB_SHA::7}"
