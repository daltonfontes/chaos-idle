name: Godot client

# Builds the Godot client, runs a smoke test inside the real Godot runtime, and exports a
# debug APK you can install on a phone (download it from the run's "Artifacts").
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used to publish screenshots to the ci-screenshots branch

env:
  GODOT_VERSION: "4.7.2"   # must equal the Godot.NET.Sdk version in client/ChaosIdle.Client.csproj

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x
          # 9: Godot 4.7's Android export templates require it. 8: the game server, for the cloud screenshots.

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot (.NET) and export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot"
          bin=$(find "$HOME/godot" -type f -name "Godot_v*_mono_linux*.x86_64" | head -1)
          chmod +x "$bin"
          echo "GODOT=$bin" >> "$GITHUB_ENV"

          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$dest"
          unzip -q templates.tpz -d "$RUNNER_TEMP/templates"
          mv "$RUNNER_TEMP/templates/templates/"* "$dest/"

      - name: Configure Android SDK, Java and debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          minor="${GODOT_VERSION%.*}"
          mkdir -p "$HOME/.config/godot"
          for name in "editor_settings-4.tres" "editor_settings-${minor}.tres"; do
            cat > "$HOME/.config/godot/$name" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS
          done
          # Google sign-in needs the APK's signing key registered in Google Cloud (its SHA-1), so the
          # key must stay the same between builds: use the ANDROID_DEBUG_KEYSTORE_BASE64 secret when
          # it is set (password "android", alias "androiddebugkey"); otherwise make a throwaway one.
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "Signing with the debug keystore from the ANDROID_DEBUG_KEYSTORE_BASE64 secret."
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "::notice::No ANDROID_DEBUG_KEYSTORE_BASE64 secret: this APK is signed with a new key, so Google sign-in won't work on it."
          fi
          echo "Signing key SHA-1 (register it on the Android OAuth client in Google Cloud):"
          keytool -list -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA1:"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # The Godot Android plugin for Google sign-in (Kotlin, Credential Manager). The export
      # addon in client/addons/chaos_google_sign_in adds this AAR and its libraries to the APK.
      - name: Build the Google sign-in Android plugin
        run: |
          gradle -p android/google-sign-in assembleRelease --no-daemon --stacktrace
          mkdir -p client/addons/chaos_google_sign_in/bin
          cp android/google-sign-in/build/outputs/aar/google-sign-in-release.aar client/addons/chaos_google_sign_in/bin/
          unzip -l client/addons/chaos_google_sign_in/bin/google-sign-in-release.aar

      - name: Import project and build C#
        run: |
          "$GODOT" --headless --path client --import
          dotnet build client/ChaosIdle.Client.csproj

      - name: Smoke test in the Godot runtime
        run: |
          "$GODOT" --headless --path client res://Smoke.tscn 2>&1 | tee smoke.log
          grep -q "SMOKE OK" smoke.log

      - name: Start the game server (in memory) for cloud sync
        run: |
          dotnet run --project src/ChaosIdle.Server --configuration Release --no-launch-profile --urls http://127.0.0.1:5080 > server.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:5080/health && break; sleep 1; done
          curl -sf http://127.0.0.1:5080/health

      - name: Screenshots (real renderer on a virtual display)
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          export SCREENSHOT_DIR="$PWD/screenshots"
          export CHAOSIDLE_SERVER_URL=http://127.0.0.1:5080   # the game syncs its save with the real server
          xvfb-run -a -s "-screen 0 720x1280x24" "$GODOT" --path client --rendering-driver opengl3 \
            --rendering-method gl_compatibility --resolution 720x1280 res://Screenshots.tscn 2>&1 | tee shots.log
          grep -q "SCREENSHOTS OK" shots.log
          grep -q "CLOUD SYNCED" shots.log
          ls -l screenshots
          pkill -f ChaosIdle.Server || true

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: error

      # Keep the latest screenshots of each branch on the 'ci-screenshots' branch, so they can be
      # viewed on GitHub (and fetched with git) without downloading an artifact. Push events only.
      - name: Publish screenshots to the ci-screenshots branch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          folder="${GITHUB_REF_NAME//\//-}"
          work="$RUNNER_TEMP/shots-branch"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin ci-screenshots > /dev/null; then
            git clone --quiet --depth 1 --branch ci-screenshots "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$work"
          else
            git init --quiet "$work"
            git -C "$work" checkout --quiet --orphan ci-screenshots
            git -C "$work" remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
          mkdir -p "$work/$folder"
          cp screenshots/*.png "$work/$folder/"
          echo "Screenshots from ${GITHUB_SHA} (${GITHUB_REF_NAME}), run ${GITHUB_RUN_ID}" > "$work/$folder/SOURCE.txt"
          git -C "$work" add -A
          git -C "$work" commit --quiet -m "Screenshots for ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}" || { echo "No changes."; exit 0; }
          for i in 1 2 3; do git -C "$work" push --quiet origin ci-screenshots && break; sleep 5; git -C "$work" pull --quiet --rebase origin ci-screenshots || true; done

      - name: Export debug APK
        timeout-minutes: 25
        env:
          SERVER_URL: ${{ vars.CHAOSIDLE_SERVER_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -o pipefail
          mkdir -p client/build
          # The server address and Google Web client id go into the APK from the repository's
          # Actions variables (Settings > Secrets and variables > Actions > Variables), when set.
          if [ -n "${SERVER_URL}" ]; then
            sed -i "s|^cloud/server_url=.*|cloud/server_url=\"${SERVER_URL}\"|" client/project.godot
          fi
          if [ -n "${GOOGLE_CLIENT_ID}" ]; then
            sed -i "s|^auth/google_web_client_id=.*|auth/google_web_client_id=\"${GOOGLE_CLIENT_ID}\"|" client/project.godot
          fi
          grep -E "^(cloud/server_url|auth/google_web_client_id)=" client/project.godot
          # Android plugins need a Gradle build. --install-android-build-template only works together
          # with an export (on its own it leaves the editor running): it installs the template, then exports.
          "$GODOT" --headless --path client --install-android-build-template --export-debug "Android" build/chaos-idle-debug.apk 2>&1 | tee export.log
          test -f client/android/build/build.gradle || { echo "::error::The Android build template was not installed."; exit 1; }
          ls -l client/build
          # Godot can finish an export "with warnings" while leaving the C# code out of the APK.
          # Fail on any export error, and prove the game assembly is inside the package.
          if grep -E "^ERROR: (Export|System\.|Cannot export)" export.log; then
            echo "::error::Godot reported export errors (see above)."; exit 1
          fi
          unzip -l client/build/chaos-idle-debug.apk | grep -E "ChaosIdle\.(Client|App|Domain|Simulation)\.dll" \
            || { echo "::error::The APK does not contain the game's .NET assemblies."; exit 1; }
          # The Google sign-in plugin must be compiled into the APK and registered in its manifest.
          unzip -p client/build/chaos-idle-debug.apk 'classes*.dex' | grep -a -q "com/chaosidle/googlesignin/GoogleSignInPlugin" \
            || { echo "::error::The APK does not contain the Google sign-in plugin."; exit 1; }
          unzip -p client/build/chaos-idle-debug.apk 'classes*.dex' | grep -a -q "androidx/credentials/CredentialManager" \
            || { echo "::error::The APK does not contain Credential Manager."; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: chaos-idle-debug-apk
          path: client/build/chaos-idle-debug.apk
          if-no-files-found: error
