# The game server on the internet: Caddy (HTTPS) -> server -> PostgreSQL, plus daily backups.
# Setup and day-to-day commands: docs/deploy.md.
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d
name: chaos-idle

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates: keep this volume
      - caddy_config:/config
    depends_on:
      - server

  server:
    image: ${SERVER_IMAGE:-ghcr.io/daltonfontes/chaos-idle-server:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # No published port: only Caddy reaches it, which is what makes trusting its forwarded headers safe.
    expose:
      - "8080"
    environment:
      ConnectionStrings__Postgres: Host=postgres;Username=chaosidle;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};Database=chaosidle
      ForwardedHeaders__Enabled: "true"
      Auth__Google__ClientIds__0: ${GOOGLE_WEB_CLIENT_ID:-}
      RateLimits__AnonymousPerMinute: ${RATE_LIMIT_ANONYMOUS_PER_MINUTE:-20}
      RateLimits__AccountPerMinute: ${RATE_LIMIT_ACCOUNT_PER_MINUTE:-120}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chaosidle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chaosidle
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaosidle -d chaosidle"]
      interval: 5s
      timeout: 5s
      retries: 20

  # A compressed pg_dump every day into ./backups (see backup.sh). Copy that folder off the machine too.
  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: chaosidle
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: chaosidle
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
